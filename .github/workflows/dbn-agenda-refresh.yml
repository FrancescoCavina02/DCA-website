name: Refresh DBN Competition Agenda

on:
  workflow_dispatch:
  schedule:
    # Check for the next season agenda at strategic preseason dates, not daily.
    - cron: "0 8 1,15 8-10 *"

jobs:
  refresh-agenda:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Read DBN agenda and refresh season data
        id: agenda
        run: python scripts/sync_dbn_agenda.py

      - name: Refresh current Tournify fixtures and standings
        if: steps.agenda.outputs.changed == 'true' && steps.agenda.outputs.season_changed != 'true'
        run: python scripts/sync_tournify.py --site-file competitions.html

      - name: Open or update agenda refresh pull request
        if: steps.agenda.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/dbn-agenda-refresh
          add-paths: |
            .github/workflows/tournify-sync.yml
            data/dbn_competition_days.json
            competitions.html
          commit-message: "Refresh DCA competition season from DBN agenda"
          title: "Refresh DCA competition season from DBN agenda"
          draft: true
          body: |
            This pull request follows the public DBN agenda feeds and updates the DCA season dates, competition page, and exact post-event sync triggers.
            New seasons are staged by archiving the previous season's managed results and standings, then adding the next published DBN event to each team timeline.
            Review the season dates, venues, event labels, and page layout before merging.
