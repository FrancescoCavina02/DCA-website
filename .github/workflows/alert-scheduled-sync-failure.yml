name: Alert on scheduled DCA sync failure

on:
  workflow_run:
    workflows:
      - DCA Competition Sync
    types:
      - completed

permissions:
  issues: write

jobs:
  open-issue:
    if: >-
      github.event.workflow_run.event == 'schedule' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          title="Scheduled DCA Competition Sync failed"
          issue_number="$(gh issue list \
            --repo "$GH_REPO" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == "Scheduled DCA Competition Sync failed") | .number' \
            | sed -n '1p')"

          body="$(cat <<EOF
          The scheduled DCA Competition Sync ended with **$RUN_CONCLUSION**.

          - Run: $RUN_URL
          - Run ID: $RUN_ID
          - Started: $RUN_STARTED_AT
          EOF
          )"

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GH_REPO" --body "$body"
          else
            gh issue create --repo "$GH_REPO" --title "$title" --body "$body"
          fi
